# Guárdalo en tu repo como: .github/workflows/snake.yml
name: Generar serpiente

on:
  schedule:
    - cron: "0 0 * * *"   # se actualiza cada día
  workflow_dispatch:       # permite ejecutarlo a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generar SVG de la serpiente
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FFFFFF&color_dots=#161B22,#3B4A8C,#3B82F6,#8B7CFF,#B497FF

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
